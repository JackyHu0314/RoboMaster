name: Generate Ubuntu Terminal Screenshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xterm imagemagick fonts-dejavu-core

      - name: Capture complete terminal window
        shell: bash
        run: |
          mkdir -p images
          cat > /tmp/run_homework.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -e
          cd "$GITHUB_WORKSPACE"
          clear
          echo '$ grep -E "^(PRETTY_NAME|VERSION_ID)=" /etc/os-release'
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          echo
          echo '$ cmake -S . -B build'
          cmake -S . -B build
          echo
          echo '$ cmake --build build --clean-first'
          cmake --build build --clean-first
          echo
          echo '$ ./build/hello'
          ./build/hello
          echo
          echo 'Build and run completed successfully.'
          sleep 20
          SCRIPT
          chmod +x /tmp/run_homework.sh

          Xvfb :99 -screen 0 1600x1000x24 > /tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 2
          xterm -geometry 118x42+30+20 -fa 'DejaVu Sans Mono' -fs 14 \
            -title 'Ubuntu 22.04 - RoboMaster CMake Build and Run' \
            -e /tmp/run_homework.sh &
          sleep 10
          import -window root images/success.png
          identify images/success.png

      - name: Commit verified screenshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add images/success.png
          git diff --cached --quiet || git commit -m "docs: replace evidence with complete Ubuntu terminal screenshot"
          git push

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-terminal-screenshot
          path: images/success.png
